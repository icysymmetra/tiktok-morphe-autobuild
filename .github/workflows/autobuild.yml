name: TikTok Morphe AutoBuild

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Check releases and compatibility without downloading or patching the base APK
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autobuild.yml"
      - "original-apk/manifest.json"
      - "scripts/autobuild.sh"

permissions:
  contents: write
  issues: write

concurrency:
  group: tiktok-morphe-autobuild
  cancel-in-progress: false

jobs:
  autobuild:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out builder configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run autobuilder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only || 'false' }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash scripts/autobuild.sh

